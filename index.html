    <!-- Theme Color — updated dynamically by ThemeContext -->
    <meta name="theme-color" content="#0b0d18" />

    <!-- Anti-flash: apply stored/OS theme before first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
            document.querySelector('meta[name="theme-color"]')
              ?.setAttribute('content', stored === 'light' ? '#f7f5f1' : '#080b14');
            return;
          }
        } catch (_) {}
        if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#f7f5f1');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
